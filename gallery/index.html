<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GALLERY — AETHER / KINETIC STUDIO</title>
  <meta name="description" content="Browse the full AETHER / Kinetic Studio project archive.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="gallery.css?v=1">
</head>
<body>

  <div class="grid-overlay" aria-hidden="true"></div>

  <header class="gallery-header">
    <a href="/" class="brand">AETHER<span>/GALLERY</span></a>
    <a href="/" class="back-link">← SITE</a>
  </header>

  <main>
    <h1 class="page-title">PROJECT <span>ARCHIVE</span></h1>

    <div class="filter-bar" role="group" aria-label="Filter by category">
      <button type="button" class="filter-pill active" data-category="">ALL</button>
      <!-- category pills injected here -->
    </div>

    <!-- Mobile-only 3D centerpiece. Hidden on desktop by CSS; canvas only sized/rendered when visible. -->
    <div class="centerpiece-stage" aria-hidden="true">
      <canvas id="centerpiece-canvas"></canvas>
    </div>

    <p class="empty-state" hidden>No projects in this category yet.</p>

    <div class="gallery-grid" id="gallery-grid" aria-live="polite">
      <!-- project cards injected here -->
    </div>
  </main>

  <!-- Detail view -->
  <div class="detail-backdrop" id="detail-backdrop" hidden>
    <div class="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detail-title">
      <button type="button" class="detail-close" id="detail-close" aria-label="Close">✕</button>
      <div class="detail-media">
        <img id="detail-image" alt="">
      </div>
      <div class="detail-body">
        <p class="detail-meta" id="detail-meta"></p>
        <h2 id="detail-title"></h2>
        <p class="detail-subtitle" id="detail-subtitle"></p>
        <div class="detail-tags" id="detail-categories"></div>
        <dl class="detail-facts">
          <div><dt>Year</dt><dd id="detail-year">—</dd></div>
          <div><dt>Deliverables</dt><dd id="detail-deliverables">—</dd></div>
          <div><dt>Tech</dt><dd id="detail-tech">—</dd></div>
        </dl>
        <p class="detail-desc" id="detail-desc"></p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/scripts/supabase-config.js?v=2"></script>
  <script src="vendor/three.min.js"></script>
  <script src="centerpiece.js"></script>
  <script src="/gallery/gallery.js?v=2"></script>
</body>
</html>
